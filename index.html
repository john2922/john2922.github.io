<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🏀 香港籃球生涯 · 完整版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang HK', sans-serif;
            background: #1a1a2e; color: #fff;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 12px;
            position: relative;
        }
        .credit-mark {
            position: fixed;
            bottom: 12px;
            right: 16px;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 999;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
        }
        #app {
            max-width: 860px; width: 100%;
            background: linear-gradient(145deg, #16213e, #0f3460);
            border-radius: 32px; padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,165,0,0.2);
            position: relative;
        }
        .cover-badge { text-align:center; color:rgba(255,255,255,0.2); font-size:11px; margin-top:4px; letter-spacing:1px; }
        .cover-badge strong { color:rgba(255,165,0,0.3); }
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 6px; padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,165,0,0.3); margin-bottom: 12px;
        }
        .game-title { font-size: 20px; font-weight: 900; background: linear-gradient(135deg,#ff8c00,#ff4500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .header-actions .btn-sm { padding: 4px 12px; font-size: 11px; border-radius: 20px; border: none; background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .header-actions .btn-sm:hover { background: rgba(255,165,0,0.2); }
        .player-badge {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 50px;
            border: 1px solid rgba(255,165,0,0.2); font-size: 11px;
        }
        .player-badge .number { background: #ff8c00; color: #1a1a2e; font-weight: 900; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .player-badge .name { font-weight: 700; }
        .player-badge .pos { background: rgba(255,165,0,0.2); padding: 0 8px; border-radius: 12px; color: #ffa500; }
        .info-bar {
            display: flex; flex-wrap: wrap; gap: 4px 12px;
            background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 14px; margin-bottom: 12px;
            font-size: 11px; border: 1px solid rgba(255,255,255,0.05);
        }
        .info-item .label { color: #8899bb; }
        .info-item .value { color: #ffa500; font-weight: 600; }
        .info-item .value.highlight { color: #4fc3f7; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #aabbdd; margin-bottom: 3px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.35);
            color: #fff; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #ff8c00; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn {
            padding: 8px 18px; border: none; border-radius: 14px; font-size: 13px;
            font-weight: 700; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-primary { background: linear-gradient(135deg,#ff8c00,#ff4500); color: #fff; box-shadow: 0 4px 16px rgba(255,140,0,0.3); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-success { background: linear-gradient(135deg,#00c853,#00e676); color: #1a1a2e; }
        .btn-danger { background: linear-gradient(135deg,#d50000,#ff1744); color: #fff; }
        .btn-block { width: 100%; display: flex; justify-content: center; }
        .text-center { text-align: center; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .question-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .question-box .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .option-btn {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 8px 14px; color: #dde4f0; font-size: 13px;
            cursor: pointer; transition: 0.2s; text-align: left; display: flex; align-items: center; gap: 8px;
        }
        .option-btn:hover:not(:disabled) { background: rgba(255,165,0,0.08); border-color: rgba(255,165,0,0.3); }
        .option-btn .tag { background: rgba(255,165,0,0.15); color: #ffa500; font-weight: 700; padding: 0 8px; border-radius: 8px; font-size: 11px; }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .option-btn.selected { border-color: #ff8c00; background: rgba(255,140,0,0.12); }
        .result-box { background: rgba(0,0,0,0.4); border-radius: 16px; padding: 14px; margin: 10px 0; text-align: center; }
        .result-box .dice { font-size: 36px; }
        .result-box .result-text { font-size: 14px; line-height: 1.6; }
        .positive { color: #69f0ae; }
        .negative { color: #ff8a80; }
        .neutral { color: #ffd740; }
        .stat-change { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 6px; font-size: 12px; }
        .stat-change .up { color: #69f0ae; }
        .stat-change .down { color: #ff8a80; }
        .school-reveal { background: linear-gradient(135deg, rgba(255,165,0,0.1), rgba(255,69,0,0.05)); border: 2px solid #ff8c00; border-radius: 16px; padding: 14px; text-align: center; margin: 10px 0; }
        .school-reveal .school-name { font-size: 22px; font-weight: 900; color: #ffa500; }
        .season-summary { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px; margin: 10px 0; font-size: 13px; line-height: 1.8; }
        .threads-box { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; margin: 10px 0; border-left: 4px solid #ff8c00; }
        .threads-box .thread { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0d0e0; font-size: 12px; }
        .threads-box .thread:last-child { border-bottom: none; }
        .threads-box .thread .user { color: #ffa500; font-weight: 600; }
        .attr-distribute { background: rgba(0,0,0,0.25); border-radius: 16px; padding: 12px; margin: 8px 0; }
        .attr-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .attr-row .attr-name { flex: 1; font-weight: 500; }
        .attr-row .attr-value { width: 32px; text-align: center; font-weight: 700; color: #ffa500; }
        .attr-row .attr-controls { display: flex; gap: 4px; }
        .attr-row .attr-controls button { width: 26px; height: 26px; border-radius: 50%; border: none; font-size: 15px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.08); color: #fff; transition: 0.2s; }
        .attr-row .attr-controls button:hover { background: rgba(255,165,0,0.3); }
        .attr-row .attr-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
        .points-display { text-align: center; font-size: 16px; font-weight: 700; color: #ffd740; margin: 6px 0; }
        .year-display { display: flex; justify-content: space-between; align-items: center; background: rgba(255,165,0,0.08); padding: 6px 12px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #ff8c00; }
        .year-display .year { font-size: 15px; font-weight: 700; }
        .year-display .year .highlight { color: #ff8c00; }
        .year-display .progress { font-size: 11px; color: #8899bb; }
        .save-notification {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: #1e2a3a; padding: 8px 20px; border-radius: 30px;
            border: 1px solid #ffa500; color: #ffa500; font-weight: 600; font-size: 13px;
            z-index: 999; opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .save-notification.show { opacity: 1; }
        .career-chart { width: 100%; max-width: 700px; margin: 10px auto; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px; }
        .career-chart canvas { width: 100% !important; height: auto !important; max-height: 200px; }
        .timeline { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 200px; overflow-y: auto; font-size: 12px; }
        .timeline .event { display: flex; justify-content: space-between; padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid #ffa500; }
        .team-choice-grid { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .team-choice-btn { padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; text-align: left; cursor: pointer; transition: 0.2s; }
        .team-choice-btn:hover { background: rgba(255,165,0,0.1); border-color: #ffa500; }
        .team-choice-btn .team-name { font-weight: 700; color: #ffa500; }
        .team-choice-btn .team-detail { font-size: 12px; color: #8899bb; }
        .team-choice-btn .team-salary { font-size: 12px; color: #69f0ae; }
        .team-choice-btn .team-thought { font-size: 12px; color: #ffd740; font-style: italic; margin-top: 4px; }
        @media (max-width: 600px) {
            #app { padding: 14px; }
            .form-row { grid-template-columns: 1fr; }
            .form-row-3 { grid-template-columns: 1fr 1fr; }
            .game-title { font-size: 17px; }
            .player-badge { font-size: 10px; padding: 2px 8px; }
            .player-badge .number { width: 22px; height: 22px; font-size: 12px; }
            .info-bar { font-size: 10px; padding: 4px 8px; }
            .question-box .q-text { font-size: 15px; }
            .option-btn { font-size: 12px; padding: 6px 10px; }
            .result-box .dice { font-size: 30px; }
            .header-actions .btn-sm { font-size: 10px; padding: 3px 8px; }
            .career-chart canvas { max-height: 150px; }
            .credit-mark { font-size: 10px; bottom: 6px; right: 8px; padding: 2px 10px; }
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="credit-mark">mchun_2922</div>

<div id="app">
    <div id="saveNotification" class="save-notification">✅ 已儲存</div>
    <div class="game-header">
        <div class="game-title">🏀 香港籃球生涯</div>
        <div class="header-actions">
            <button class="btn-sm" id="saveGameBtn">💾 保存</button>
            <button class="btn-sm" id="loadGameBtn">📂 讀取</button>
        </div>
        <div class="player-badge" id="headerBadge" style="display:none;">
            <div class="number" id="headerNumber">0</div>
            <div class="name" id="headerName">球員</div>
            <div class="pos" id="headerPos">PG</div>
        </div>
    </div>
    <div class="info-bar" id="infoBar" style="display:none;">
        <div class="info-item"><span class="label">🏫</span> <span class="value" id="infoSchool">-</span></div>
        <div class="info-item"><span class="label">📏</span> <span class="value" id="infoHeight">-</span> cm</div>
        <div class="info-item"><span class="label">🎂</span> <span class="value" id="infoAge">-</span> 歲</div>
        <div class="info-item"><span class="label">⚖️</span> <span class="value" id="infoWeight">-</span> kg</div>
        <div class="info-item"><span class="label">📚</span> <span class="value highlight" id="infoGrade">-</span></div>
        <div class="info-item"><span class="label">⭐</span> <span class="value" id="infoOverall">-</span></div>
        <div class="info-item"><span class="label">🔵</span> <span class="value" id="infoPoints">-</span> 分值</div>
        <div class="info-item" id="infoPhase"><span class="label">🏆</span> <span class="value" id="phaseText">高中</span></div>
        <div class="info-item" id="infoContract"><span class="label">📄</span> <span class="value" id="contractText">-</span></div>
        <div class="info-item" id="infoAcademic"><span class="label">📖</span> <span class="value" id="academicText">-</span></div>
        <div class="info-item" id="infoCBA"><span class="label">🏅</span> <span class="value" id="cbaText">CBA: 0/3</span></div>
    </div>
    <div class="game-content">
        <!-- 創建頁面 -->
        <div class="page active" id="pageCreate">
            <div class="create-page">
                <h2 style="color:#ffa500;text-align:center;margin-bottom:4px;">🏀 創建你的籃球生涯</h2>
                <div class="cover-badge">⚡ 13歲中學生 &amp; DeepSeek 創作而成 ⚡</div>
                <p style="text-align:center;color:#8899bb;font-size:13px;margin:8px 0;">從14歲中三開始，目標甲一、香港隊、CBA！</p>
                <div class="form-group">
                    <label>球員姓名 <span class="hint">(2-6 字)</span></label>
                    <input type="text" id="inputName" placeholder="例如：陳偉霆" maxlength="6">
                </div>
                <div class="form-row">
                    <div class="form-group"><label>球衣號碼</label><input type="number" id="inputNumber" value="7" min="0" max="99"></div>
                    <div class="form-group"><label>位置</label>
                        <select id="inputPosition">
                            <option value="PG">PG 控球後衛</option>
                            <option value="SG">SG 得分後衛</option>
                            <option value="SF" selected>SF 小前鋒</option>
                            <option value="PF">PF 大前鋒</option>
                            <option value="C">C 中鋒</option>
                        </select>
                    </div>
                </div>
                <div class="form-row-3">
                    <div class="form-group"><label>身高 (cm)</label><input type="number" id="inputHeight" value="180" min="160" max="210"></div>
                    <div class="form-group"><label>臂展 (cm)</label><input type="number" id="inputWingspan" value="185" min="155" max="230"></div>
                    <div class="form-group"><label>體重 (kg)</label><input type="number" id="inputWeight" value="72" min="50" max="130"></div>
                </div>
                <div class="form-group">
                    <label>出生地</label>
                    <select id="inputRegion">
                        <option value="中西區">中西區</option><option value="灣仔區">灣仔區</option><option value="東區">東區</option>
                        <option value="南區">南區</option><option value="油尖旺區">油尖旺區</option><option value="深水埗區">深水埗區</option>
                        <option value="九龍城區">九龍城區</option><option value="黃大仙區">黃大仙區</option><option value="觀塘區">觀塘區</option>
                        <option value="葵青區">葵青區</option><option value="荃灣區">荃灣區</option><option value="屯門區">屯門區</option>
                        <option value="元朗區">元朗區</option><option value="北區">北區</option><option value="大埔區">大埔區</option>
                        <option value="沙田區">沙田區</option><option value="西貢區">西貢區</option><option value="離島區">離島區</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-block" id="btnStartGame">🚀 開始生涯</button>
                <div id="createError" style="color:#ff8a80;font-size:13px;text-align:center;margin-top:4px;"></div>
            </div>
        </div>

        <!-- 學校分配 -->
        <div class="page" id="pageSchool">
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:48px;margin-bottom:6px;">🏫</div>
                <h2 style="color:#ffa500;">你被分配到...</h2>
                <div class="school-reveal">
                    <div class="school-name" id="schoolName">-</div>
                    <div class="school-detail" id="schoolDetail">-</div>
                </div>
                <p style="color:#8899bb;font-size:13px;">這間學校屬於 <span id="schoolLeagueLabel">-</span> 聯賽</p>
                <button class="btn btn-primary mt-10" id="btnStartGameplay">🏀 開始征戰</button>
            </div>
        </div>

        <!-- 能力分配 -->
        <div class="page" id="pageDistribute">
            <h3 style="color:#ffa500;text-align:center;margin-bottom:6px;">📊 能力分配</h3>
            <p style="text-align:center;color:#8899bb;font-size:13px;" id="distributeDesc">分配你的能力點數</p>
            <div class="points-display">可用分值：<span id="availPoints">10</span></div>
            <div id="attrList" class="attr-distribute"></div>
            <button class="btn btn-success btn-block" id="btnConfirmDistribute">✅ 確認分配</button>
            <div id="distributeError" style="color:#ff8a80;text-align:center;margin-top:4px;"></div>
        </div>

        <!-- 高中選擇學校 -->
        <div class="page" id="pageSchoolChoice">
            <h3 style="color:#ffa500;text-align:center;margin-bottom:8px;">🏫 選擇高中學校</h3>
            <p style="color:#8899bb;font-size:13px;text-align:center;">根據你的初中表現，有以下學校對你有興趣：</p>
            <div id="schoolChoiceList" style="display:flex;flex-direction:column;gap:8px;margin:12px 0;"></div>
            <button class="btn btn-secondary btn-block" id="btnSkipSchoolChoice">🤷 隨便選一間</button>
        </div>

        <!-- 球隊選擇 (畢業後) -->
        <div class="page" id="pageTeamSelect">
            <h3 style="color:#ffa500;text-align:center;margin-bottom:8px;">🏀 選擇你的職業球隊</h3>
            <p style="color:#8899bb;font-size:13px;text-align:center;" id="teamSelectDesc">以下球隊對你感興趣：</p>
            <div id="teamSelectList" class="team-choice-grid"></div>
            <button class="btn btn-danger btn-block mt-10" id="btnTeamSelectRetire">退役</button>
        </div>

        <!-- 遊戲主頁 -->
        <div class="page" id="pageGame">
            <div id="gameContent"></div>
        </div>

        <!-- 生涯回顧 -->
        <div class="page" id="pageCareerReview">
            <h2 style="color:#ffa500;text-align:center;">📜 生涯回顧</h2>
            <div id="careerReviewContent"></div>
            <button class="btn btn-primary btn-block mt-10" id="btnBackToMenu">🏠 回到主選單</button>
        </div>
    </div>
</div>

// ================================================================
//  UTILITY
// ================================================================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=rand(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function getGrade(year) { return ['中三','中四','中五','中六'][year] || '中六'; }
function getAge(year) { return 14 + year; }
function getLeague(year) { return year===0 ? 'D1初中聯賽' : 'D1高中聯賽'; }
function calcOverall(attrs) { let s=0; for (let k of ATTR_KEYS) s += attrs[k]||40; return Math.round(s/ATTR_KEYS.length); }
function getAttrLabel(k) { return ATTR_LABELS[k] || k; }
function getCost(overall) {
    if (overall < 50) return 1;
    if (overall < 60) return 2;
    if (overall < 70) return 3;
    if (overall < 80) return 4;
    if (overall < 90) return 5;
    return 6;
}

function saveGame() {

    catch(e) { showNotification('❌ 儲存失敗'); }
}
function loadGame() {
    try {
        const data = localStorage.getItem('hkbball_save');
        if (!data) { showNotification('❌ 沒有存檔'); return; }
        const parsed = JSON.parse(data);
        if (!parsed.player) { showNotification('❌ 存檔無效'); return; }
        Object.assign(G, parsed);
        if (!G.attributes) G.attributes = {};
        for (let k of ATTR_KEYS) if (!(k in G.attributes)) G.attributes[k] = 40;
        G.overall = calcOverall(G.attributes);
        if (!G.timeline) G.timeline = [];
        if (!G.seasonStats) G.seasonStats = [];
        if (!G.a1Stats) G.a1Stats = [];
        if (!G.a2Stats) G.a2Stats = [];
        if (!G.collegeStats) G.collegeStats = [];
        if (!G.cbaStats) G.cbaStats = [];
        if (!G.careerAwards) G.careerAwards = [];
        if (!G.team && (G.phase==='a1'||G.phase==='a2')) G.team = (G.phase==='a1'?pick(A1_TEAMS):pick(A2_TEAMS));
        if (!G.collegeTeam && G.phase==='college') G.collegeTeam = pick(COLLEGE_TEAMS);
        if (!G.cbaTeam && G.phase==='cba') G.cbaTeam = pick(CBA_TEAMS);
        showNotification('📂 讀取成功');
        if (G.gameOver) {
            showPage('pageGame'); renderGame();
        } else {
            if (!G.distributed) { showDistributePage('繼續能力分配'); }
            else { showPage('pageGame'); renderGame(); }
        }
        updateHeader();
    } catch(e) { showNotification('❌ 讀取失敗'); }
}

function showDistributePage(title) {
    document.getElementById('distributeDesc').textContent = title || '分配你的能力點數';
    renderDistribute();
    showPage('pageDistribute');
}

function renderDistribute() {
    const list = document.getElementById('attrList');
    let html = '';
    for (let k of ATTR_KEYS) {
        const val = G.attributes[k] || 40;
        html += `
            <div class="attr-row">
                <span class="attr-name">${getAttrLabel(k)}</span>
                <span class="attr-value" id="val_${k}">${val}</span>
                <div class="attr-controls">
                    <button data-key="${k}" data-dir="-1">−</button>
                    <button data-key="${k}" data-dir="1">+</button>
                </div>
            </div>
        `;
    }
    list.innerHTML = html;
    document.getElementById('availPoints').textContent = G.availablePoints;

    list.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            const key = this.dataset.key;
            const dir = parseInt(this.dataset.dir);
            const current = G.attributes[key] || 40;
            const overall = calcOverall(G.attributes);
            const cost = getCost(overall);
            if (dir === 1) {
                if (G.availablePoints < cost) {
                    document.getElementById('distributeError').textContent = `❌ 總評 ${overall}，升級需 ${cost} 點`;
                    return;
                }
                if (current >= 99) { document.getElementById('distributeError').textContent = '❌ 已達上限 99'; return; }
                G.attributes[key] = current + 1;
                G.availablePoints -= cost;
            } else {
                if (current <= 20) { document.getElementById('distributeError').textContent = '❌ 最低 20'; return; }
                G.attributes[key] = current - 1;
                G.availablePoints += 1;
            }
            document.getElementById('distributeError').textContent = '';
            G.overall = calcOverall(G.attributes);
            renderDistribute();
            updateHeader();
        });
    });
    document.getElementById('availPoints').textContent = G.availablePoints;
    G.overall = calcOverall(G.attributes);
    updateHeader();
}

document.getElementById('btnConfirmDistribute').addEventListener('click', function() {
    G.distributed = true;
    G.overall = calcOverall(G.attributes);
    updateHeader();
    if (G.phase === 'highschool' && G.year === 0 && G.questionIndex === 0 && !G.answered) {
        startGameplay();
    } else {
        showPage('pageGame');
        renderGame();
    }
});

            <div class="team-name">${team.name}</div>

    if (G.phase === 'highschool') {

            renderContractManagement(container);
        } else {

}

function handleAnswer(optIdx) {
    if (G.answered) return;
    G.answered = true;
    G.selectedOption = optIdx;

    const year = G.year;
    const questions = getQuestionsForYear(year);
    const qIdx = G.questionIndex;
    if (qIdx >= questions.length) return;
    const q = questions[qIdx];
    const opt = q.options[optIdx];

    const dice = rand(1, 6);
    const diff = opt.diff || 2;
    let good = false, bad = false, effect = 0, resultText = '';

    if (dice >= 5) {
        good = true;
        effect = diff * 3 + rand(0, 4);
        resultText = pick(['表現出色！', '實力提升！', '贏得全場喝彩！']);
    } else if (dice >= 3) {
        good = false;
        bad = false;
        effect = rand(0, 3);
        resultText = pick(['表現平穩', '逐漸適應']);
    } else {
        bad = true;
        effect = -(diff * 3 + rand(0, 4));
        resultText = pick(['表現不佳', '遇到挫折']);
    }

    const affected = shuffle([...ATTR_KEYS]).slice(0, 2);
    const changes = [];
    for (let k of affected) {
        const change = Math.round(effect / 2 * (0.8 + Math.random() * 0.4));
        const actual = clamp(change, -10, 10);
        G.attributes[k] = clamp(G.attributes[k] + actual, 20, 99);
        changes.push({ label: getAttrLabel(k), val: actual });
    }

    const academicChange = opt.academic || 0;
    if (academicChange !== 0) {
        G.academic = clamp(G.academic + academicChange, 0, 100);
        changes.push({ label: '學業', val: academicChange });
    }

    G.overall = calcOverall(G.attributes);
    G.lastResult = { dice, good, bad, text: resultText, changes, optIdx };

    if (good && dice === 6) {
        G.careerHighlights.push(`高中 ${getGrade(year)} 高光！`);
    }

    renderGame();
}

function handleExtraAnswer(optIdx) {
    if (G.answered) return;
    G.answered = true;
    G.selectedOption = optIdx;

    const type = G.extraQuestionsType;
    const questions = generateExtraQuestions(type, G.year);
    const localIdx = 5 - G.extraQuestionsRemaining;

    const opt = q.options[optIdx];
    const dice = rand(1,6);
    const diff = opt.diff || 2;
    let good = false, bad = false, effect = 0, resultText = '';
    if (dice >= 5) { good = true; effect = diff*3 + rand(0,4); resultText = pick(['表現出色！','實力提升！','贏得全場喝彩！']); }
    else if (dice >= 3) { good=false; bad=false; effect = rand(0,3); resultText = pick(['表現平穩','逐漸適應']); }
    else { bad=true; effect = -(diff*3 + rand(0,4)); resultText = pick(['表現不佳','遇到挫折']); }

    const affected = shuffle([...ATTR_KEYS]).slice(0, 2);
    const changes = [];
    for (let k of affected) {
        const change = Math.round(effect / 2 * (0.8 + Math.random()*0.4));
        const actual = clamp(change, -10, 10);
        G.attributes[k] = clamp(G.attributes[k] + actual, 20, 99);
        changes.push({ label: getAttrLabel(k), val: actual });
    }
    G.overall = calcOverall(G.attributes);
    G.lastResult = { dice, good, bad, text: resultText, changes, optIdx };
    if (good && dice===6) G.careerHighlights.push(`${type} 高光！`);

    if (type === 'elite') {

            if (good) {
                G.seasonStats[G.seasonStats.length-1].eliteChampion = true;
                G.careerAwards.push('精英賽冠軍');

                G.seasonStats[G.seasonStats.length-1].eliteRunnerUp = true;
                G.careerAwards.push('精英賽亞軍');

    if (type === 'naigao' && localIdx === 4) {
        G.naiGaoPlayed = true;
        if (good) G.careerAwards.push('耐高全國冠軍');

function renderSeasonEnd(container) {

    const overall = G.overall;
    const ppg = Math.round((overall/10 + rand(0,6)) * 10) / 10;
    const rpg = Math.round((overall/15 + rand(0,3)) * 10) / 10;
    const apg = Math.round((overall/20 + rand(0,2)) * 10) / 10;
    const eliteQualify = overall >= 45; // 門檻降低至 45

    let pointsEarned = 0;
    if (eliteQualify) pointsEarned += 3;
    pointsEarned += rand(1,3);
    if (overall >= 70) pointsEarned += 2;
    G.availablePoints += pointsEarned;

    const season = { year: grade, ppg, rpg, apg, elite: eliteQualify, awards: [], eliteChampion: false, eliteRunnerUp: false, naiGao: false };
    if (ppg >= 20 && overall >= 70) season.awards.push('學界MVP');

function handleCollegeAnswer(optIdx) {
    if (G.answered) return;
    G.answered = true;
    G.selectedOption = optIdx;
    const year = G.collegeYear;
    const questions = [
        { text: '大專聯賽揭幕戰，你希望以什麼心態應戰？', options: [
            { label: 'A. 穩健為主', desc: '減少失誤，打好基礎', diff: 2 },
            { label: 'B. 積極進攻', desc: '展現個人能力', diff: 3 },
            { label: 'C. 放手一搏', desc: '挑戰大專紀錄', diff: 5 }
        ] },
        { text: '學業與籃球平衡，你如何取捨？', options: [
            { label: 'A. 籃球優先', desc: '全力投入訓練', diff: 3, academic: -3 },
            { label: 'B. 學業優先', desc: '確保成績', diff: 1, academic: 3 },
            { label: 'C. 兩者兼顧', desc: '合理分配時間', diff: 2, academic: 1 }
        ] },
        { text: '大專盃八強賽，你手感火燙。你該？', options: [
            { label: 'A. 繼續出手', desc: '乘勝追擊', diff: 3 },
            { label: 'B. 吸引防守', desc: '為隊友創造機會', diff: 1 },
            { label: 'C. 放手一搏', desc: '挑戰個人得分紀錄', diff: 5 }
        ] }
    ];
    const q = questions[G.questionIndex] || questions[0];
    const opt = q.options[optIdx];
    const dice = rand(1,6);
    const diff = opt.diff || 2;
    let good = false, bad = false, effect = 0, resultText = '';
    if (dice >= 5) { good = true; effect = diff*3 + rand(0,4); resultText = pick(['表現出色！','實力提升！','贏得全場喝彩！']); }
    else if (dice >= 3) { good=false; bad=false; effect = rand(0,3); resultText = pick(['表現平穩','逐漸適應大專節奏']); }
    else { bad=true; effect = -(diff*3 + rand(0,4)); resultText = pick(['表現不佳','遇到挫折']); }

    const affected = shuffle([...ATTR_KEYS]).slice(0, 2);
    const changes = [];
    for (let k of affected) {
        const change = Math.round(effect / 2 * (0.8 + Math.random()*0.4));
        const actual = clamp(change, -10, 10);
        G.attributes[k] = clamp(G.attributes[k] + actual, 20, 99);
        changes.push({ label: getAttrLabel(k), val: actual });
    }
    const academicChange = opt.academic || 0;
    if (academicChange !== 0) {
        G.academic = clamp(G.academic + academicChange, 0, 100);
        changes.push({ label: '學業', val: academicChange });
    }
    G.overall = calcOverall(G.attributes);
    G.lastResult = { dice, good, bad, text: resultText, changes, optIdx };
    if (good && dice===6) G.careerHighlights.push(`大專第${G.collegeYear+1}年 高光！`);
    renderGame();
}

    document.getElementById('btnContinuePro')?.addEventListener('click', ()=>{
        if (isCBA) {
            if (G.cbaContractYear > G.cbaContractLength) G.freeAgent = true;
        } else {
            if (G.contractYear > G.contractLength) G.freeAgent = true;
        }
        G.questionIndex = 0;
        G.answered = false;
        G.distributed = false;
        showDistributePage('職業能力分配');
        updateHeader();
    });
    document.getElementById('btnRetirePro')?.addEventListener('click', ()=>{
        G.retired = true;
        G.retirementReason = '結束職業生涯';
        G.gameOver = true;
        renderGame();
    });
    updateHeader();
}

//  合約管理 (含 CBA 選秀、CBA 續約/轉會)
// ================================================================
function renderContractManagement(container) {
    const isCBA = G.phase === 'cba';
    const currentTeam = isCBA ? G.cbaTeam : G.team;
    const overall = G.overall;

    let html = `
        <div class="season-end">
            <h3 style="color:#ffa500;text-align:center;">📄 合約管理</h3>
            <div class="season-summary">
                <p>目前球隊：<strong>${currentTeam || '無'}</strong> (${isCBA ? 'CBA' : (G.phase==='a1'?'甲一':'甲二')})</p>
                <p>合約狀態：${G.freeAgent ? '自由球員' : `合約到期`}</p>
                <p>當前總評：${overall}</p>
                <p>🏅 CBA 選秀機會：${G.cbaDraftAttempts}/3 ${G.cbaDrafted ? '✅ 已獲選' : ''}</p>
            </div>
    `;

    if (!G.cbaDrafted && G.cbaDraftAttempts < 3 && !isCBA) {
        const cbaInterest = overall >= 70;
        html += `
            <div style="background:rgba(255,215,0,0.1);border-radius:12px;padding:10px;margin:10px 0;border:1px solid rgba(255,215,0,0.3);">
                <p style="color:#ffd740;">🏀 你獲得 CBA 選秀機會！ (第 ${G.cbaDraftAttempts+1}/3 次)</p>
                ${cbaInterest ? `<p style="color:#69f0ae;">✅ 你有機會被選中！</p>` : `<p style="color:#ff8a80;">❌ 你的總評 (${overall}) 未達 CBA 門檻 (70)，選秀機會渺茫。</p>`}
                <button class="btn btn-primary btn-block mt-10" id="btnCBA_Draft">🏅 參加 CBA 選秀</button>
            </div>
        `;
    }

    if (G.freeAgent) {
        html += `<p style="color:#ffd740;">🏀 你現在是自由球員，以下球隊對你有興趣：</p>`;
        const interested = getInterestedTeams(overall);
        if (interested.length === 0) {
            html += `<p style="color:#ff8a80;">沒有球隊對你感興趣，你可能需要考慮退役。</p>`;
            html += `<button class="btn btn-danger btn-block mt-10" id="btnRetireFree">退役</button>`;
        } else {
            html += `<div class="team-choice-grid">`;
            interested.forEach(team => {
                const salary = (team.league === '甲一' ? 80 + rand(0,40) : 20 + rand(0,15)) * 10000;
                const thought = pick(THOUGHTS);
                html += `
                    <button class="team-choice-btn" data-team="${team.name}" data-league="${team.league}" data-salary="${salary}">
                        <div class="team-name">${team.name}</div>
                        <div class="team-detail">${team.league}</div>
                        <div class="team-salary">💰 年薪 $${(salary/10000).toFixed(1)} 萬</div>
                        <div class="team-thought">💭 ${thought}</div>
                    </button>
                `;
            });
            html += `</div>`;
        }
    } else {
        if (isCBA) {
            const renewSalary = 150000 + rand(0,50) * 10000;
            const renewLength = rand(1,2);
            html += `
                <p style="color:#aabbdd;">原隊 <strong>${currentTeam}</strong> 提供一份 ${renewLength} 年 CBA 合約，年薪 $${(renewSalary/10000).toFixed(1)} 萬人民幣。</p>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
                    <button class="btn btn-success" id="btnRenewCBA">✅ 接受續約 (${renewLength}年)</button>
                    <button class="btn btn-secondary" id="btnOtherCBA">🔄 嘗試加盟其他 CBA 球隊</button>
                    <button class="btn btn-danger" id="btnLeaveCBA">❌ 離開 CBA，回到香港聯賽</button>
                </div>
            `;
        } else {
            const renewSalary = (G.phase==='a1' ? 80 + rand(0,40) : 20 + rand(0,15)) * 10000;
            const renewLength = rand(1,2);
            html += `
                <p style="color:#aabbdd;">原隊 <strong>${currentTeam}</strong> 提供一份 ${renewLength} 年合約，年薪 $${(renewSalary/10000).toFixed(1)}萬。</p>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
                    <button class="btn btn-success" id="btnRenew">✅ 接受續約 (${renewLength}年)</button>
                    <button class="btn btn-danger" id="btnDeclineRenew">❌ 拒絕，進入自由球員市場</button>
                </div>
            `;
        }
    }

    container.innerHTML = html;

    document.getElementById('btnCBA_Draft')?.addEventListener('click', ()=>{
        if (G.cbaDraftAttempts >= 3) {
            showNotification('❌ 已用完選秀機會');
            return;
        }
        G.cbaDraftAttempts++;
        const dice = rand(1,100);
        const threshold = Math.min(80, 50 + G.overall);
        if (dice <= threshold) {
            G.cbaDrafted = true;
            G.cbaTeam = pick(CBA_TEAMS);
            G.phase = 'cba';
            G.cbaContractYear = 1;
            G.cbaContractLength = rand(1,2);
            G.freeAgent = false;
            G.timeline.push({ year: 'CBA', text: `以第 ${rand(1,20)} 順位被 ${G.cbaTeam} 選中` });

            showNotification(`🎉 恭喜！被 ${G.cbaTeam} 選中！`);
            G.distributed = false;
            showDistributePage('CBA 能力分配');
            updateHeader();
        } else {
            showNotification('❌ 選秀落選，繼續努力！');
            G.timeline.push({ year: 'CBA', text: `第 ${G.cbaDraftAttempts} 次選秀落選` });
            renderGame();
        }
    });

    if (G.freeAgent) {
        const retireBtn = document.getElementById('btnRetireFree');
        if (retireBtn) {
            retireBtn.addEventListener('click', ()=>{
                G.retired = true;
                G.retirementReason = '無球隊感興趣，選擇退役';
                G.gameOver = true;
                renderGame();
            });
        }
        document.querySelectorAll('.team-choice-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const teamName = this.dataset.team;
                const league = this.dataset.league;
                const salary = parseInt(this.dataset.salary);
                G.team = teamName;
                G.phase = league === '甲一' ? 'a1' : 'a2';
                G.contractYear = 1;
                G.contractLength = rand(1,2);
                G.freeAgent = false;
                if (G.phase === 'a1') G.a1Year++;
                else G.a2Year++;
                G.totalSalary += salary;
                G.timeline.push({ year: `職業`, text: `自由球員簽約 ${teamName} (${G.contractLength}年)` });
                G.careerHighlights.push(`加盟 ${teamName}`);
                G.distributed = false;
                showDistributePage('新賽季能力分配');
                updateHeader();
            });
        });
    } else {
        const renewBtn = document.getElementById('btnRenew') || document.getElementById('btnRenewCBA');
        if (renewBtn) {
            renewBtn.addEventListener('click', ()=>{
                if (isCBA) {
                    G.cbaContractYear = 1;
                    G.cbaContractLength = rand(1,2);
                    G.freeAgent = false;
                    G.timeline.push({ year: `CBA`, text: `與 ${G.cbaTeam} 續約 ${G.cbaContractLength} 年` });
                } else {
                    G.contractYear = 1;
                    G.contractLength = rand(1,2);
                    G.freeAgent = false;
                    G.timeline.push({ year: `職業`, text: `與 ${G.team} 續約 ${G.contractLength} 年` });
                }
                G.distributed = false;
                showDistributePage('續約後能力分配');
                updateHeader();
            });
        }
        const otherBtn = document.getElementById('btnOtherCBA');
        if (otherBtn) {
            otherBtn.addEventListener('click', ()=>{
                const otherTeams = CBA_TEAMS.filter(t => t !== G.cbaTeam);
                const newTeam = pick(otherTeams);
                G.cbaTeam = newTeam;
                G.cbaContractYear = 1;
                G.cbaContractLength = rand(1,2);
                G.freeAgent = false;
                G.timeline.push({ year: `CBA`, text: `轉會至 ${newTeam} (${G.cbaContractLength}年)` });
                G.distributed = false;
                showDistributePage('CBA 能力分配');
                updateHeader();
            });
        }
        const leaveBtn = document.getElementById('btnLeaveCBA');
        if (leaveBtn) {
            leaveBtn.addEventListener('click', ()=>{
                G.phase = G.overall >= 50 ? 'a1' : 'a2';
                G.team = pick(G.phase==='a1' ? A1_TEAMS : A2_TEAMS);
                G.contractYear = 1;
                G.contractLength = rand(1,2);
                G.freeAgent = false;
                G.cbaTeam = null;
                G.cbaContractYear = 0;
                G.cbaContractLength = 0;
                G.timeline.push({ year: `職業`, text: `離開 CBA，加盟香港 ${G.team}` });
                G.distributed = false;
                showDistributePage('職業能力分配');
                updateHeader();
            });
        }
        const declineBtn = document.getElementById('btnDeclineRenew');
        if (declineBtn) {
            declineBtn.addEventListener('click', ()=>{
                G.freeAgent = true;
                G.contractYear = 0;
                G.contractLength = 0;
                G.timeline.push({ year: `職業`, text: `拒絕續約，成為自由球員` });
                renderGame();
                updateHeader();
            });
        }
    }
}

function getInterestedTeams(overall) {
    let pool = [];
    if (overall >= 50) {
        pool = A1_TEAMS.map(name => ({ name, league: '甲一' }));
    } else if (overall >= 40) {
        pool = A2_TEAMS.map(name => ({ name, league: '甲二' }));
    } else {
        return [];
    }
    const shuffled = shuffle(pool);
    return shuffled.slice(0, rand(3,5));
}

function drawCareerChart() {
    const canvas = document.getElementById('careerChartCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const start = 40;
    const end = G.overall;
    const steps = G.seasonStats.length + G.collegeStats.length + G.a1Stats.length + G.a2Stats.length + G.cbaStats.length;
    if (steps === 0) return;
    const data = [];
    for (let i=0; i<=steps; i++) {
        const progress = i / steps;
        const val = start + (end - start) * progress;
        data.push(val);
    }
    ctx.strokeStyle = '#ffa500';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const padding = 30;
    const xStep = (w - padding*2) / (data.length - 1);
    for (let i=0; i<data.length; i++) {
        const x = padding + i * xStep;
        const y = h - padding - (data[i] / 100) * (h - padding*2);
        if (i===0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#fff';
    for (let i=0; i<data.length; i++) {
        const x = padding + i * xStep;
        const y = h - padding - (data[i] / 100) * (h - padding*2);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.fillStyle = '#8899bb';
    ctx.font = '10px sans-serif';
    ctx.fillText('起始', padding, h-10);
    const lastIdx = data.length-1;
    ctx.fillText('現在', padding + lastIdx*xStep - 10, h-10);
    ctx.fillStyle = '#ffa500';
    ctx.font = '12px sans-serif';
    ctx.fillText('總評進化', 10, 20);
}

// ================================================================
//  THREADS
// ================================================================
function generateThreads(grade, ppg, rpg, apg, overall, elite) {
    const users = ['籃球仔_','hkballer','northpoint_hooper','d1_fan','elite_watcher','hoopdreams','甲一 scouts'];
    const comments = [];
    if (ppg > 20) comments.push('🔥 得分機器！');
    else if (ppg > 15) comments.push('穩定輸出，球隊支柱！');
    else comments.push('繼續磨練，將來可期！');
    if (rpg > 8) comments.push('籃板怪獸！');
    if (apg > 5) comments.push('視野一流！');
    if (elite) comments.push('精英賽見真章！');
    else comments.push('下年再嚟過！');
    if (overall >= 70) comments.push('🌟 全明星級別！');
    if (overall >= 50) comments.push('甲一球隊應該留意佢！');
    const shuffled = shuffle(comments);
    const selected = shuffled.slice(0, rand(3,4));
    return selected.map(text => ({ user: pick(users), text }));
}
